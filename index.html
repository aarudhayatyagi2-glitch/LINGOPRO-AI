<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoPro | Infinite Neural Bridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --genz: #ff3e81; --bg: #050505; --card: #0a0a0a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; background: var(--card); padding: 60px 40px; border-radius: 4px; border: 1px solid #111; text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,1); }
        h1 { font-size: 5rem; font-weight: 800; letter-spacing: -5px; background: linear-gradient(to bottom, #fff 40%, #333); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub { color: var(--gold); font-size: 0.8rem; letter-spacing: 4px; margin-bottom: 50px; opacity: 0.8; text-transform: uppercase; font-weight: 800; }
        .search-area { display: flex; align-items: center; border-bottom: 1px solid #222; max-width: 500px; margin: 0 auto 40px; padding: 10px 0; }
        input { background: transparent; border: none; color: white; font-size: 1.4rem; outline: none; flex: 1; font-weight: 200; }
        .btn-ai { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 10px 25px; font-size: 0.75rem; font-weight: 800; cursor: pointer; letter-spacing: 2px; }
        #panel { display: none; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }
        .label { font-size: 0.6rem; font-weight: 800; color: #444; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 15px; display: block; }
        .res-word { font-size: 4rem; font-weight: 800; color: #fff; margin-bottom: 20px; letter-spacing: -2px; }
        .box { background: rgba(255,255,255,0.02); padding: 30px; border-radius: 12px; border: 1px solid #111; text-align: left; margin-bottom: 30px; }
        .box p { font-size: 1.2rem; line-height: 1.6; color: #ccc; }
        .genz-box { border: 1px dashed var(--genz); background: linear-gradient(135deg, #100010 0%, #050505 100%); }
    </style>
</head>
<body>
    <div class="container">
        <h1>LingoPro</h1>
        <p class="sub">Infinite Neural Linguistic Engine</p>
        <div class="search-area">
            <input type="text" id="target" placeholder="Search anything in the universe..." autocomplete="off">
            <button class="btn-ai" onclick="elevate()">ELEVATE</button>
        </div>
        <div id="panel">
            <span class="label">Advanced Alternative</span>
            <div class="res-word" id="outW">---</div>
            <span class="label">Natural Context</span>
            <div class="box"><p id="outP">---</p></div>
            <span class="label" style="color:var(--genz)">Gen-Z Dynamic Slang</span>
            <div class="box genz-box"><p id="outG" style="color:#eee">---</p></div>
        </div>
    </div>

    <script>
        // INFINITE SLANG CONSTRUCTOR
        const openers = ["No cap,", "Honestly,", "Lowkey,", "Highkey,", "Say less,", "Bro,", "Trust me,"];
        const middle = ["it's the [W] for me,", "we're in our [W] era,", "that [W] is giving,", "the vibes are purely [W],", "this [W] situation is"];
        const closers = ["absolute main character energy. ✨", "totally iconic. 💅", "literally a whole mood. 🔥", "purely for the plot. 🚀", "validated for real. 💯", "hitting different. ⚡"];

        const usagePatterns = [
            "A [W] perspective is often the most effective way to handle this.",
            "The [W] nature of the situation caught everyone's attention.",
            "She applied a very [W] method to ensure the best results.",
            "Everyone was quite impressed by how [W] the final outcome was."
        ];

        async function elevate() {
            const input = document.getElementById('target').value.toLowerCase().trim();
            if(!input) return;
            const btn = document.querySelector('.btn-ai');
            btn.innerText = "THINKING...";

            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${input}`);
                const data = await res.json();
                
                let syn = (data[0] && data[0].meanings[0].synonyms[0]) ? data[0].meanings[0].synonyms[0] : input;
                
                // 1. ADVANCED WORD
                const advanced = syn.toUpperCase();

                // 2. DYNAMIC CONTEXT
                const pLine = usagePatterns[Math.floor(Math.random() * usagePatterns.length)].replace("[W]", syn.toLowerCase());

                // 3. INFINITE SLANG SYNTHESIS
                const o = openers[Math.floor(Math.random() * openers.length)];
                const m = middle[Math.floor(Math.random() * middle.length)].replace("[W]", input);
                const c = closers[Math.floor(Math.random() * closers.length)];
                const gLine = `${o} ${m} ${c}`;

                render(advanced, pLine, gLine);
            } catch (e) {
                render(input.toUpperCase(), "Linguistic status verified.", "Vibes are valid, no cap. 💯");
            } finally {
                document.getElementById('panel').style.display = 'block';
                btn.innerText = "ELEVATE";
            }
        }

        function render(w, p, g) {
            document.getElementById('outW').innerText = w;
            document.getElementById('outP').innerText = p;
            document.getElementById('outG').innerText = g;
        }

        document.getElementById('target').addEventListener('keypress', (e) => { if(e.key === 'Enter') elevate(); });
    </script>
</body>
</html>
