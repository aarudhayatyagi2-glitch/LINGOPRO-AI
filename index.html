<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoPro AI | Transformation Engine</title>
    <style>
        :root { --accent: #00f2fe; --bg: #020617; }
        body { 
            background: radial-gradient(circle at top right, #0f172a, #020617); 
            color: white; font-family: 'Segoe UI', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; overflow-x: hidden;
        }
        .container { 
            text-align: center; width: 90%; max-width: 700px; padding: 50px; 
            background: rgba(255,255,255,0.03); backdrop-filter: blur(25px); 
            border-radius: 40px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        h1 { font-size: 3.5rem; margin: 0; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tagline { color: #94a3b8; margin-bottom: 40px; font-weight: 300; letter-spacing: 1px; }
        
        .search-area { position: relative; display: flex; gap: 15px; margin-bottom: 25px; }
        input { 
            flex: 1; padding: 20px 30px; border-radius: 15px; border: none; 
            background: rgba(255,255,255,0.07); color: white; font-size: 1.1rem;
            border: 1px solid rgba(255,255,255,0.1); transition: 0.4s;
        }
        input:focus { border-color: var(--accent); outline: none; background: rgba(255,255,255,0.12); }
        
        .glow-btn { 
            padding: 0 35px; border-radius: 15px; border: none; 
            background: var(--accent); color: #000; font-weight: 800; 
            cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(0,242,254,0.4);
        }
        .glow-btn:hover { transform: translateY(-3px); box-shadow: 0 0 30px var(--accent); }

        .suggestions { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; }
        .chip { 
            padding: 10px 20px; background: rgba(255,255,255,0.05); border-radius: 10px; 
            font-size: 0.9rem; cursor: pointer; transition: 0.3s; border: 1px solid rgba(255,255,255,0.05);
        }
        .chip:hover { background: rgba(0,242,254,0.1); border-color: var(--accent); color: var(--accent); }

        #resultCard { 
            margin-top: 30px; padding: 30px; border-radius: 20px; 
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,242,254,0.02));
            border: 1px solid rgba(0,242,254,0.2); display: none; text-align: left;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .res-label { color: var(--accent); font-size: 0.8rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .res-word { font-size: 2.2rem; margin: 10px 0; font-weight: 700; color: #fff; }
        .res-usage { color: #cbd5e1; font-style: italic; border-left: 3px solid var(--accent); padding-left: 15px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>LingoPro</h1>
        <p class="tagline">Elevating mundane vocabulary into high-status linguistics.</p>

        <div class="search-area">
            <input type="text" id="userInput" placeholder="Type a mundane word (e.g. Happy, Small)...">
            <button class="glow-btn" onclick="aiTransform()">TRANSFORM</button>
        </div>

        <div class="suggestions">
            <div class="chip" onclick="fillAndGo('Happy')">Happy</div>
            <div class="chip" onclick="fillAndGo('Smart')">Smart</div>
            <div class="chip" onclick="fillAndGo('Pretty')">Pretty</div>
            <div class="chip" onclick="fillAndGo('Hard')">Hard</div>
        </div>

        <div id="resultCard">
            <div class="res-label">Status Transformation</div>
            <div class="res-word" id="transformedWord">---</div>
            <div class="res-label" style="margin-top: 20px;">Contextual Usage</div>
            <div class="res-usage" id="usageSentence">---</div>
        </div>
    </div>

    <script>
        // AI Mapping Database (Ensures results every time)
        const aiDatabase = {
            "happy": { word: "JUBILANT", sentence: "The board was jubilant after the record-breaking quarterly results." },
            "pretty": { word: "EXQUISITE", sentence: "The architectural design of the new library is truly exquisite." },
            "smart": { word: "ASTUTE", sentence: "She made an astute observation regarding the market trends." },
            "hard": { word: "FORMIDABLE", sentence: "The team faced a formidable challenge during the final phase." },
            "small": { word: "DIMINUTIVE", sentence: "The device is diminutive in size but powerful in performance." },
            "bad": { word: "DEPLORABLE", sentence: "The conditions of the old laboratory were absolutely deplorable." },
            "good": { word: "EXEMPLARY", sentence: "His exemplary conduct earned him the 'Student of the Year' award." },
            "call": { word: "CONVENE", sentence: "We need to convene a meeting to discuss the project milestones." }
        };

        function aiTransform() {
            const input = document.getElementById('userInput').value.toLowerCase().trim();
            const card = document.getElementById('resultCard');
            
            if(!input) return;

            // Simple Logic: Check DB first, else fetch API
            if(aiDatabase[input]) {
                showResult(aiDatabase[input].word, aiDatabase[input].sentence);
            } else {
                // Fallback to API if not in our "AI" list
                fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${input}`)
                .then(res => res.json())
                .then(data => {
                    const syn = data[0]?.meanings[0]?.synonyms[0];
                    if(syn) {
                        showResult(syn.toUpperCase(), `The context requires a more ${syn} approach to maintain professional standards.`);
                    } else {
                        showResult(input.toUpperCase() + " (ELITE)", "This term is already at its peak linguistic status.");
                    }
                }).catch(() => {
                    showResult("SOPHISTICATED", "Logic error: Unable to connect to the linguistic neural network.");
                });
            }
        }

        function showResult(word, sentence) {
            document.getElementById('transformedWord').innerText = word;
            document.getElementById('usageSentence').innerText = `"${sentence}"`;
            document.getElementById('resultCard').style.display = 'block';
        }

        function fillAndGo(val) {
            document.getElementById('userInput').value = val;
            aiTransform();
        }
    </script>
</body>
</html>
